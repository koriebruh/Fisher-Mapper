name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same PR/branch cancels the previous run -- no point
# burning runner minutes on a commit that's already superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every job resolves the Go toolchain version from go.mod (go-version-file
  # below) instead of a hardcoded version here -- one source of truth,
  # bumping go.mod's `go` directive is enough to move CI too.
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (no drift)
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod || { echo "go.mod is out of date -- run 'go mod tidy' and commit the result"; exit 1; }
          diff -u go.sum.orig go.sum || { echo "go.sum is out of date -- run 'go mod tidy' and commit the result"; exit 1; }

      # golangci-lint-action v6 only drives golangci-lint v1 -- .golangci.yml
      # uses the v2 config schema (version: "2", separate formatters: block),
      # which a v1 binary rejects outright. v7+ of the action is the v2-only
      # generation. version is pinned to the exact release validated locally
      # (not "latest") for the same reason the Makefile pins
      # PROTOC_GEN_GO_VERSION/PROTOC_GEN_GO_GRPC_VERSION: a floating version
      # here would make this job's pass/fail depend on whatever golangci-lint
      # released today, not on the config actually developed against.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all binaries
        run: |
          go build -o bin/server ./cmd/server
          go build -o bin/worker ./cmd/worker
          go build -o bin/migrate ./cmd/migrate

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # TEST_POSTGRES_DSN is deliberately unset here -- DB-gated integration
      # tests self-skip (see internal test files' own gating), leaving only
      # the pure-unit suite. The DB-backed half runs in test-integration
      # below, against real services, not mocked.
      - name: go test ./... -race
        run: go test ./... -race -count=1

  test-integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fisher
          POSTGRES_PASSWORD: fisher
          POSTGRES_DB: fisher_mapper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fisher -d fisher_mapper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # TEST_POSTGRES_DSN only -- APP_POSTGRES_DSN is deliberately NOT set
      # here. It's redundant (config.toml's [postgres].dsn at the repo root
      # already matches this service container's user/pass/db/port
      # exactly, so `go run ./cmd/migrate` below needs no env override at
      # all) and actively harmful: internal/platform/config's own unit
      # tests (TestLoad_TOMLOverlayOverridesDefaults,
      # TestLoad_EnvOverridesTOML) assert specific TOML-vs-env precedence
      # behavior using their own throwaway DSNs, and an inherited
      # APP_POSTGRES_DSN in the process environment silently overrides
      # those, breaking both tests the moment they run in the same job as
      # this env block (confirmed locally: reproduces even outside CI, any
      # shell that exports APP_POSTGRES_DSN before `go test ./...` breaks
      # these two tests the same way).
      TEST_POSTGRES_DSN: postgres://fisher:fisher@localhost:5432/fisher_mapper?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migrations
        run: go run ./cmd/migrate

      # -p 1: several packages share the same Postgres tables under
      # TEST_POSTGRES_DSN (see Makefile's test-db target) -- running their
      # test binaries as concurrent OS processes is a source of
      # cross-package flakiness on shared DB state that -p 1 removes.
      - name: go test ./... -race -p 1 (DB-gated included)
        run: go test ./... -race -p 1 -count=1

  coverage:
    name: Coverage report + threshold gate
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fisher
          POSTGRES_PASSWORD: fisher
          POSTGRES_DB: fisher_mapper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fisher -d fisher_mapper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same env block as test-integration (and the same reasoning: no
      # APP_POSTGRES_DSN here -- see that job's comment -- an inherited one
      # breaks internal/platform/config's TestLoad_TOMLOverlayOverridesDefaults
      # / TestLoad_EnvOverridesTOML by silently overriding their own
      # throwaway DSNs).
      TEST_POSTGRES_DSN: postgres://fisher:fisher@localhost:5432/fisher_mapper?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migrations
        run: go run ./cmd/migrate

      # -p 1 for the same reason test-integration uses it: several packages
      # share tables under TEST_POSTGRES_DSN, and concurrent package test
      # binaries against that shared DB is a source of cross-package
      # flakiness. -race is deliberately omitted -- coverage measurement and
      # race detection are orthogonal concerns, and race mode only slows this
      # job down for no coverage-accuracy benefit.
      - name: go test ./... -coverprofile (DB-gated included)
        run: go test ./... -coverprofile=coverage.out -covermode=atomic -count=1 -p 1

      # Measured actual total on this codebase (all packages, DB-gated tests
      # included) at the time this gate was added: 40.1%. Threshold is set to
      # 37% -- a few points below the actual, so the gate has real teeth
      # against a genuine regression without being a hair-trigger on the
      # normal +/-1-2% fluctuation a shared-DB integration suite can show
      # between runs.
      - name: Enforce coverage threshold
        run: |
          COVERAGE_THRESHOLD=37.0
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${total}%"
          echo "Threshold: ${COVERAGE_THRESHOLD}%"
          awk -v cov="$total" -v thr="$COVERAGE_THRESHOLD" 'BEGIN { exit !(cov < thr) }' && {
            echo "Coverage ${total}% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          }
          echo "Coverage ${total}% meets the ${COVERAGE_THRESHOLD}% threshold"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  proto-sync:
    name: Proto stubs in sync
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned (not @latest) for the same reason the Makefile pins
      # PROTOC_GEN_GO_VERSION/PROTOC_GEN_GO_GRPC_VERSION: this job's whole
      # point is catching regen drift, so the tool itself can't be a
      # floating target. v1.72.0 is the version this pipeline was validated
      # against (`make proto` reproduces a byte-for-byte empty diff).
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Regenerate proto stubs
        run: make proto

      - name: Fail if regeneration produced a diff
        run: |
          if ! git diff --quiet -- internal/transport/grpc/pb; then
            echo "Committed generated proto stubs are out of sync with proto/*.proto -- run 'make proto' and commit the result"
            git diff --stat -- internal/transport/grpc/pb
            exit 1
          fi

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck traces the actual call graph, not just "a CVE exists
      # somewhere in a dependency you happen to import" -- far fewer
      # irrelevant-to-you false positives than a manifest-only scanner.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # A native `go install` + run, not the securego/gosec Docker action:
      # that action (pinned to the floating @master ref, itself a red flag)
      # was observed dying silently mid-scan on the real runner -- the job
      # log cuts off right after the import phase, before a single "Checking
      # file" line, the signature of a container OOM-kill, not a real
      # finding (confirmed by running the same scan natively: 0 issues
      # across all 72 files). Pinned to v2.28.0 for the same reproducibility
      # reason every other tool in this pipeline is pinned.
      #
      # -no-fail is deliberately NOT passed: strict CI means a real finding
      # fails the job, not just gets silently recorded for later.
      # -exclude-generated skips internal/transport/grpc/pb/*.pb.go
      # (protoc-gen-go's own "Code generated ... DO NOT EDIT." files use
      # unsafe.Slice/unsafe.StringData internally -- a sanctioned, standard
      # pattern in generated protobuf code, not something this repo can fix
      # by editing a file `make proto` would overwrite anyway).
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -exclude-generated -fmt sarif -out gosec-results.sarif ./...

      # v4.37.7 (matching codeql.yml/the docker job's trivy upload, not the
      # v3 this step started on -- codeql-action v3 is deprecating Dec 2026).
      # continue-on-error: same transient-5xx reasoning as the docker job's
      # trivy upload -- an ingestion hiccup on informational Security-tab
      # findings must never fail an otherwise-clean govulncheck+gosec scan.
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

  docker:
    name: Docker build + trivy scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        target: [server, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3.12.0

      # push: false (this repo isn't set up to push to a registry, that's
      # out of scope here -- this job only proves the image builds and
      # passes a vulnerability scan) + load: true so the built image lands
      # in the local Docker daemon, where trivy's image-ref below can find
      # it -- push:false alone leaves the image only in the buildx cache,
      # invisible to `docker`/trivy afterward.
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: fisher-mapper-${{ matrix.target }}:ci

      # Two invocations, same shape as gosec's "scan, upload SARIF
      # unconditionally, then gate": exit-code 1 on the first pass would
      # skip the SARIF upload entirely (a failed step's later steps still
      # run without `if: always()`, but the SARIF file itself wouldn't
      # exist yet if THIS step is what fails). Scan #1 always produces the
      # report; scan #2 is the strict gate.
      # trivy-action's own `version` input pins the trivy SCANNER binary it
      # fetches -- pinning the action alone (0.35.0 above) does not pin this;
      # left as the action's own floating default, this job's pass/fail would
      # depend on whatever trivy release exists on the day it runs, the exact
      # failure mode ci.yml's golangci-lint-action comment already warns
      # about. v0.69.3 is trivy-action@0.35.0's own tested default, pinned
      # explicitly here rather than left implicit.
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fisher-mapper-${{ matrix.target }}:ci
          version: v0.69.3
          format: sarif
          output: trivy-${{ matrix.target }}-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      # continue-on-error: GitHub's SARIF-ingestion endpoint has been
      # observed returning transient 5xx errors independent of this repo
      # (hit this same endpoint on the unrelated `security` job's gosec
      # upload too) -- an ingestion hiccup uploading INFORMATIONAL findings
      # to the Security tab must never fail an otherwise-clean scan. The
      # real pass/fail signal is "Trivy scan (gate)" below, unaffected by
      # this.
      - name: Upload trivy SARIF
        uses: github/codeql-action/upload-sarif@v4.37.7
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.target }}-results.sarif
          category: trivy-${{ matrix.target }}

      # The real gate: matches gosec's own "-no-fail deliberately not
      # passed" philosophy -- a real CRITICAL/HIGH vuln fails the job, not
      # just gets silently recorded in the Security tab for later.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fisher-mapper-${{ matrix.target }}:ci
          version: v0.69.3
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
