# Bootstrap config — loaded after hardcoded defaults, before env var
# overrides (APP_POSTGRES_DSN, APP_REDIS_ADDR, APP_HTTP_PORT, APP_LOG_LEVEL).
#
# This file MUST only contain values needed before any connection exists.
# Anything else (feature flags, retry counts, provider toggles) belongs in
# the Postgres app_config table (dynamic config, loaded after DB connect).

[postgres]
dsn = "postgres://fisher:fisher@localhost:5432/fisher_mapper?sslmode=disable"

[redis]
addr = "localhost:6379"

[http]
port = 8080

[log]
level = "info"

# Everything below is NOT bootstrap config -- it seeds dynamic config rows in
# Postgres app_config (see internal/platform/db/migrations/00006_dynamic_config_seeds.sql,
# which mirrors these same literals) and, for otel_enabled only, is also read
# directly by internal/platform/config.LoadDynamicSeed at boot because the OTel
# tracer must exist before Postgres connects. Once app_config has a row for
# a key, that row governs -- editing this file after first migration/boot
# has no runtime effect; change the row instead (PUT /admin/config/:key or
# psql).

[queue]
default_name = "default"

[observability]
otel_enabled = true
