# Bootstrap config — loaded after hardcoded defaults, before env var
# overrides (APP_POSTGRES_DSN, APP_REDIS_ADDR, APP_HTTP_PORT, APP_GRPC_PORT,
# APP_LOG_LEVEL).
#
# This file MUST only contain values needed before any connection exists.
# Anything else (feature flags, retry counts, provider toggles) belongs in
# the Postgres app_config table (dynamic config, loaded after DB connect).

[postgres]
dsn = "postgres://fisher:fisher@localhost:5432/fisher_mapper?sslmode=disable"

[redis]
addr = "localhost:6379"

[http]
port = 8080

[grpc]
port = 9090

[log]
level = "info"

[service]
name = "fisher-mapper" # cmd/worker suffixes this ("-worker") rather than needing its own key

# Everything below is process-tuning / feature-flag config, mostly NOT
# bootstrap: most of it seeds dynamic config rows in Postgres app_config (see
# internal/platform/db/migrations/00006_dynamic_config_seeds.sql and
# 00007_toggle_seeds.sql, which mirror these same literals) and, for
# otel_enabled only, is also read directly by internal/platform/config.LoadDynamicSeed
# at boot because the OTel tracer must exist before Postgres connects. Once
# app_config has a row for a key, that row governs -- editing this file after
# first migration/boot has no runtime effect; change the row instead (PUT
# /admin/config/:key or psql).
#
# EXCEPTION: [ratelimit]'s rate_per_second/burst below are bootstrap-only
# (process tuning, read once at startup to build the limiter) even though
# they share a TOML table with the dynamic-seeded `enabled` toggle -- see that
# section's comment.

[queue]
# default_name is the one physical asynq queue every task type below
# dispatches into today (per-task-type routing is a documented, not-yet-built
# option -- see internal/messaging/outbox/relay.go's providerCarryingTaskTypes).
default_name = "default"
# Task types this app produces (internal/platform/queue.TaskTypeCharge /
# TaskTypeRefund) -- NOT configurable here on purpose: a task type is
# persisted verbatim in the outbox table, so renaming it in config.toml would
# strand every already-enqueued row the asynq mux can no longer match.
#   "charge" -- create-charge (Decide Now item 12: no-auto-retry, resolved by reconciliation, never a queue retry)
#   "refund" -- process-refund
# asynq's own retry/scheduled/archive queues are internal bookkeeping, not
# named topics; a task that ends up permanently unresolvable is recorded in
# the Postgres terminal_failures table instead (internal/platform/queue/dlq.go),
# not a separate named queue.

[observability]
otel_enabled = true # false disables tracing entirely (e.g. no collector available in this environment)

[ratelimit]
enabled = true # false disables the token-bucket limiter on REST /payments and the gRPC interceptor (e.g. local dev, load testing) -- dynamic-config-seeded, see note above
rate_per_second = 20 # bootstrap-only: token-bucket refill rate, read once at startup
burst = 40 # bootstrap-only: token-bucket max burst size, read once at startup

[circuitbreaker]
enabled = true # false bypasses the per-provider breaker so calls reach the provider regardless of trip state (e.g. a sandbox PJP that intentionally simulates failures)

[reconciliation]
enabled = true # false pauses the reconciliation job (e.g. during a maintenance window) without stopping the rest of the worker process

# No [webhook] verify-signature toggle here on purpose: a DB-flippable
# bypass on a money endpoint would let anyone with admin-config access forge
# a webhook straight to "succeeded" (internal/provider/auth.HMACVerifier is
# fail-closed the same way RegisterVerifiers/adminAPIKey already are). For a
# sandbox PJP that doesn't sign, omit that provider from
# bootstrap.RegisterVerifiers' map instead (restart, not a live flip).
