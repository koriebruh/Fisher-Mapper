services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fisher
      POSTGRES_PASSWORD: fisher
      POSTGRES_DB: fisher_mapper
    ports:
      - "5432:5432"
    volumes:
      - fisher_mapper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisher -d fisher_mapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # asynqmon: queue inspection UI, now actually useful with the Fase 3
  # worker/task layer in place. It has no built-in auth of its own (only a
  # Redis password option, which doesn't protect the dashboard itself).
  #
  # Fase 3 decision (see phase report for the full tradeoff): a basic-auth
  # wrapper turned out to be buildable purely in Go (mount
  # github.com/hibiken/asynqmon's http.Handler behind fiber's basicauth
  # middleware) rather than needing an external reverse proxy -- but
  # asynqmon's latest release pins asynq v0.24.1 against this module's
  # v0.26.0, an unverified cross-version combination, and wiring it in means
  # a new dependency, a new port, new config/credentials, and
  # docker-compose churn on top of an already large phase. Deferred on
  # scope grounds; loopback-only binding remains the standing mitigation --
  # never expose this port on a non-localhost interface without adding that
  # wrapper (or a reverse proxy) first.
  asynqmon:
    image: hibiken/asynqmon:latest
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  fisher_mapper_postgres_data:
