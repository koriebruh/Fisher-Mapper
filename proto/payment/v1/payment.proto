syntax = "proto3";

package payment.v1;

option go_package = "Fisher-Mapper/internal/transport/grpc/pb/payment/v1;paymentv1";

// PaymentService is the gRPC transport for the same payment.Service REST
// exposes under internal/transport/rest/payment.go and refund.go — thin
// wrapper, no business logic. See internal/transport/grpc/server.go.
//
// Deliberately excluded (out of scope per Fase 6): webhook ingestion and
// admin/dynamic-config endpoints — both are HTTP-specific (PJP webhook
// callbacks arrive as HTTP POSTs; /admin/config is an operator-only REST
// surface), not general-purpose client RPCs.
service PaymentService {
  // CreatePayment mirrors REST's POST /payments: it does NOT block for the
  // provider call. A fresh request always returns status "pending"
  // (replayed=false); the actual provider call happens later in the async
  // worker (outbox -> asynq -> ProcessCharge), exactly as it does for REST.
  // Poll GetPayment for the eventual outcome.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  // GetPayment mirrors REST's GET /payments/{id}.
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // CreateRefund mirrors REST's POST /payments/{id}/refunds: async by
  // construction, same as CreatePayment.
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);

  // GetRefund mirrors REST's GET /payments/refunds/{id}.
  rpc GetRefund(GetRefundRequest) returns (GetRefundResponse);

  // CreatePayout mirrors REST's POST /payouts: a standalone money-OUT
  // operation, independent of any prior charge (unlike CreateRefund). Async
  // by construction, same as CreatePayment/CreateRefund.
  rpc CreatePayout(CreatePayoutRequest) returns (CreatePayoutResponse);

  // GetPayout mirrors REST's GET /payouts/{id}.
  rpc GetPayout(GetPayoutRequest) returns (GetPayoutResponse);
}

// CreatePaymentRequest mirrors REST's createPaymentRequest body plus the
// Idempotency-Key header — gRPC has no header equivalent a client reliably
// sets, so idempotency_key is a first-class message field instead.
// CreatePaymentRequest has no tenant_id field (reserved, not removed --
// field 2 must never be reused by a future field): tenant identity now
// comes from the AUTHENTICATED caller (the x-api-key metadata resolved by
// grpc.TenantAuthInterceptor, see internal/transport/grpc/interceptor_auth.go),
// never a client-supplied value -- a request could otherwise claim any
// tenant it liked (the CRITICAL finding this change closes).
message CreatePaymentRequest {
  reserved 2;
  reserved "tenant_id";
  string idempotency_key = 1;
  bool livemode = 3;
  string currency = 4;
  // amount is minor units (cents) — int64, never a float. Locked money
  // invariant (plan "Invarian Uang — Decide Now" item 1).
  int64 amount = 5;
  string provider = 6;
  string payment_method = 7;
  map<string, string> metadata = 8;
  // source_app/description are the two caller-supplied Envelope fields —
  // see payment.Envelope's doc. Both optional; an empty string is treated
  // as "not set" (plain string, not proto3 `optional`, since that
  // distinction has no meaning either field needs to make).
  string source_app = 9;
  string description = 10;
  // callback_url is optional -- see payment.CreatePaymentInput.CallbackURL's
  // doc. Empty string is "not set", validated (rejected before persistence)
  // when non-empty and not a valid http(s) URL.
  string callback_url = 11;
}

message CreatePaymentResponse {
  string payment_id = 1;
  // status is the domain payment.Status value verbatim (pending, processing,
  // succeeded, failed) — a plain string, not an enum, so it can never drift
  // out of sync with internal/domain/payment/statemachine.go's own strings.
  string status = 2;
  string provider_ref = 3;
  // replayed has no REST equivalent field (REST signals this via 200-vs-202
  // instead, see CreatePaymentOutput's json:"-" tag) — gRPC has no analogous
  // per-call status-code channel available to a handler, so it is a real
  // response field here. Deliberate transport-level divergence.
  bool replayed = 4;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentResponse {
  string payment_id = 1;
  string tenant_id = 2;
  bool livemode = 3;
  string currency = 4;
  int64 amount = 5;
  string operation_type = 6;
  string provider = 7;
  string provider_ref = 8;
  string status = 9;
  // Envelope fields (see payment.Envelope's doc), exposed verbatim —
  // mirrors REST's paymentView.
  string source_app = 10;
  string channel = 11;
  string trace_id = 12;
  string description = 13;
  string initiated_by = 14;
  string request_ip = 15;
  string request_user_agent = 16;
  // payment_method/method_payload/callback_url mirror REST's paymentView --
  // see internal/domain/payment.Payment's doc for each field. Empty
  // string / absent nested message is proto3's natural "not set"; a gRPC
  // client distinguishes "no method_payload" from "empty MethodPayload" via
  // the generated GetMethodPayload() nil-check, same shape as REST's JSON
  // null.
  string payment_method = 17;
  MethodPayload method_payload = 18;
  string callback_url = 19;
}

// MethodPayload mirrors internal/provider/payload.MethodPayload: only the
// nested message matching method is set, the rest left absent (proto3's
// analogue of REST's "rest are nil -> JSON null").
message MethodPayload {
  string method = 1;
  QRIS qris = 2;
  VirtualAccount virtual_account = 3;
  Card card = 4;
  EWallet ewallet = 5;
}

// QRIS mirrors internal/provider/payload.QRIS. expires_at is RFC3339,
// empty string = absent (a plain string, not google.protobuf.Timestamp, to
// avoid a WKT import/timestamppb conversion for a template this small).
message QRIS {
  string qr_string = 1;
  string expires_at = 2;
}

// VirtualAccount mirrors internal/provider/payload.VirtualAccount.
message VirtualAccount {
  string bank_code = 1;
  string va_number = 2;
  string expires_at = 3;
}

// Card mirrors internal/provider/payload.Card. masked_pan is display-only
// (e.g. "411111******1111") — see provider.go's PCI-DSS scope note.
message Card {
  string masked_pan = 1;
  string redirect_url = 2;
}

// EWallet mirrors internal/provider/payload.EWallet.
message EWallet {
  string redirect_url = 1;
  string expires_at = 2;
}

// CreateRefundRequest deliberately has no tenant_id/livemode field — same as
// REST's CreateRefundInput, those are derived server-side from the locked
// parent payment row (see rest/refund.go's handleCreateRefund), never taken
// from the caller, so a request can't point a refund at another tenant.
message CreateRefundRequest {
  string idempotency_key = 1;
  string payment_id = 2;
  string currency = 3;
  int64 amount = 4;
  // source_app/description mirror CreatePaymentRequest's fields — see
  // payment.Envelope's doc.
  string source_app = 5;
  string description = 6;
}

message CreateRefundResponse {
  string refund_id = 1;
  string payment_id = 2;
  string status = 3;
  bool replayed = 4;
}

message GetRefundRequest {
  string refund_id = 1;
}

message GetRefundResponse {
  string refund_id = 1;
  string payment_id = 2;
  string tenant_id = 3;
  bool livemode = 4;
  string currency = 5;
  int64 amount = 6;
  string provider = 7;
  string provider_ref = 8;
  string provider_refund_ref = 9;
  string status = 10;
  // Envelope fields (see payment.Envelope's doc), exposed verbatim —
  // mirrors REST's refundView.
  string source_app = 11;
  string channel = 12;
  string trace_id = 13;
  string description = 14;
  string initiated_by = 15;
  string request_ip = 16;
  string request_user_agent = 17;
}

// CreatePayoutRequest has no counterpart-derived fields (unlike
// CreateRefundRequest): a payout is standalone, so provider/destination are
// caller-supplied here, not derived server-side from a parent row.
// CreatePayoutRequest has no tenant_id field -- see CreatePaymentRequest's
// doc, identical reasoning.
message CreatePayoutRequest {
  reserved 2;
  reserved "tenant_id";
  string idempotency_key = 1;
  bool livemode = 3;
  string currency = 4;
  int64 amount = 5;
  string provider = 6;
  string destination = 7;
  map<string, string> metadata = 8;
  // source_app/description mirror CreatePaymentRequest's fields — see
  // payment.Envelope's doc.
  string source_app = 9;
  string description = 10;
  // callback_url mirrors CreatePaymentRequest's field — see
  // payment.CreatePayoutInput.CallbackURL's doc.
  string callback_url = 11;
}

message CreatePayoutResponse {
  string payout_id = 1;
  string status = 2;
  string provider_ref = 3;
  bool replayed = 4;
}

message GetPayoutRequest {
  string payout_id = 1;
}

message GetPayoutResponse {
  string payout_id = 1;
  string tenant_id = 2;
  bool livemode = 3;
  string currency = 4;
  int64 amount = 5;
  string operation_type = 6;
  string provider = 7;
  string provider_ref = 8;
  string destination = 9;
  string status = 10;
  // Envelope fields (see payment.Envelope's doc), exposed verbatim —
  // mirrors REST's payoutView.
  string source_app = 11;
  string channel = 12;
  string trace_id = 13;
  string description = 14;
  string initiated_by = 15;
  string request_ip = 16;
  string request_user_agent = 17;
  // callback_url mirrors REST's payoutView. A payout has no
  // payment_method/method_payload analogue -- see payoutView's doc.
  string callback_url = 18;
}
